<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ambient micro:bit Skulptur</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
        }

        .panel {
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            max-width: 300px;
            transition: all 0.3s ease;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #e0e0ff;
        }

        p {
            margin: 0 0 20px 0;
            font-size: 0.85rem;
            color: #999;
            line-height: 1.4;
        }

        button {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: transform 0.1s, box-shadow 0.2s, background 0.3s;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
        }

        button:active {
            transform: translateY(1px);
        }

        button.secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: none;
        }
        
        button.secondary:hover {
            background: rgba(255,255,255,0.05);
        }

        #status {
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f43f5e;
            transition: background-color 0.3s;
            box-shadow: 0 0 8px currentColor;
        }
        
        .dot.connected { background-color: #10b981; }
        .dot.simulating { background-color: #3b82f6; }

        #debug-data {
            font-family: monospace;
            font-size: 0.75rem;
            color: #666;
            margin-top: 15px;
            display: none;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="panel">
            <h1>Synæstesi i bevægelse V7</h1>
            <p>Forbind din BBC micro:bit for at interagere med skulpturen og lyden via accelerometeret.</p>
            
            <button id="btn-connect">Forbind micro:bit</button>
            <button id="btn-simulate" class="secondary">Brug mus (Simulation)</button>
            
            <div id="status">
                <div id="status-dot" class="dot"></div>
                <span id="status-text">Afventer forbindelse...</span>
            </div>
            
            <div id="debug-data">X: 0.00 | Y: 0.00 | Z: 0.00</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const state = {
            rawAccel: { x: 0, y: 0, z: 0 },
            smoothAccel: { x: 0, y: 0, z: 0 },
            lastZ: 0,
            isConnected: false,
            isSimulating: false,
            audioInitialized: false,
            currentNoteIndex: -1
        };

        const BT_SERVICES = {
            ACCEL_SERVICE: "e95d0753-251d-470a-a062-fa1922dfa9a8",
            ACCEL_DATA: "e95dca46-251d-470a-a062-fa1922dfa9a8",
            ACCEL_PERIOD: "e95dfb24-251d-470a-a062-fa1922dfa9a8"
        };

        const btnConnect = document.getElementById('btn-connect');
        const btnSimulate = document.getElementById('btn-simulate');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const debugData = document.getElementById('debug-data');

        const audioNodes = {};
        const scale = ["C2", "Eb2", "F2", "G2", "Bb2", "C3", "Eb3", "F3", "G3", "Bb3", "C4"];

        async function initAudio() {
            if (state.audioInitialized) return;
            
            await Tone.start();
            
            audioNodes.reverb = new Tone.Reverb({ decay: 8, preDelay: 0.1, wet: 0.6 }).toDestination();
            await audioNodes.reverb.generate();

            audioNodes.delay = new Tone.PingPongDelay("4n.", 0.4).connect(audioNodes.reverb);
            
            audioNodes.filter = new Tone.Filter({ type: "lowpass", frequency: 1000, rolloff: -24, Q: 2 }).connect(audioNodes.delay);

            audioNodes.drone = new Tone.FMSynth({
                harmonicity: 1.5,
                modulationIndex: 3.5,
                oscillator: { type: "sine" },
                modulation: { type: "triangle" },
                envelope: { attack: 2, decay: 0.5, sustain: 1, release: 4 }
            }).connect(audioNodes.filter);
            audioNodes.drone.volume.value = -12;

            audioNodes.chimes = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.01, decay: 0.3, sustain: 0.2, release: 3 }
            }).connect(audioNodes.reverb);
            audioNodes.chimes.volume.value = -8;

            audioNodes.drone.triggerAttack("C3");
            state.audioInitialized = true;
        }

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.05);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const colorLight1 = new THREE.PointLight(0x4f46e5, 5, 20);
        colorLight1.position.set(-5, 0, 5);
        scene.add(colorLight1);

        const colorLight2 = new THREE.PointLight(0xf43f5e, 5, 20);
        colorLight2.position.set(5, -5, 2);
        scene.add(colorLight2);

        const geometry = new THREE.IcosahedronGeometry(2.5, 32); 
        geometry.setAttribute('originalPosition', new THREE.BufferAttribute(new Float32Array(geometry.attributes.position.array), 3));

        const material = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.1,
            roughness: 0.2,
            transmission: 0.9,
            thickness: 1.5,
            ior: 1.4,
            wireframe: false,
            side: THREE.DoubleSide
        });

        const wireMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.05 });
        const wireMesh = new THREE.Mesh(geometry, wireMaterial);
        wireMesh.scale.set(0.98, 0.98, 0.98);

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        scene.add(wireMesh);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function connectBluetooth() {
            if (!navigator.bluetooth) {
                updateStatus(false, false, "Bluetooth ikke understøttet i denne browser. Brug mus.");
                return;
            }

            try {
                await initAudio();
                statusText.innerText = "Søger... Vælg 'BBC micro:bit'";
                
                // Vi søger efter enheder, hvis navn starter med "BBC micro:bit"
                // og beder eksplicit om adgang til Accelerometer-tjenesten.
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC micro:bit" }],
                    optionalServices: [BT_SERVICES.ACCEL_SERVICE]
                });

                device.addEventListener('gattserverdisconnected', () => {
                    updateStatus(false, false, "Forbindelse mistet. Prøv igen.");
                });

                statusText.innerText = "Forbinder (venter på Windows)...";
                await sleep(800); // Giver Windows Bluetooth-stack tid til at ånde ud

                let server;
                let retries = 3;
                while (retries > 0) {
                    try {
                        server = await device.gatt.connect();
                        break; 
                    } catch (err) {
                        retries--;
                        console.warn(`GATT fejl. Forsøg tilbage: ${retries}`, err);
                        if (retries === 0) throw err; 
                        statusText.innerText = `Forbinder... (Forsøg ${4-retries}/3)`;
                        await sleep(1500); 
                    }
                }

                statusText.innerText = "Gør accelerometer klar...";
                const service = await server.getPrimaryService(BT_SERVICES.ACCEL_SERVICE);

                const periodChar = await service.getCharacteristic(BT_SERVICES.ACCEL_PERIOD);
                await periodChar.writeValue(new Uint16Array([20])); // Hurtig opdatering

                const dataChar = await service.getCharacteristic(BT_SERVICES.ACCEL_DATA);
                await dataChar.startNotifications();
                dataChar.addEventListener('characteristicvaluechanged', handleSensorData);

                updateStatus(true, false, "Forbundet!");
                debugData.style.display = "block";

            } catch (error) {
                console.error("Bluetooth fejl:", error);
                
                if (error.name === "SecurityError") {
                    updateStatus(false, false, "Bluetooth blokeret af sikkerhedsårsager.");
                } else if (error.name === "NotFoundError") {
                    updateStatus(false, false, "Annulleret eller enhed ikke fundet.");
                } else {
                    updateStatus(false, false, "Fejl: " + error.message);
                }
            }
        }

        function handleSensorData(event) {
            const dataView = event.target.value;
            let x = dataView.getInt16(0, true) / 1024.0;
            let y = dataView.getInt16(2, true) / 1024.0;
            let z = dataView.getInt16(4, true) / 1024.0;

            state.rawAccel = {
                x: Math.max(-1.5, Math.min(1.5, x)),
                y: Math.max(-1.5, Math.min(1.5, y)),
                z: Math.max(-1.5, Math.min(1.5, z))
            };
            
            debugData.innerText = `X: ${state.rawAccel.x.toFixed(2)} | Y: ${state.rawAccel.y.toFixed(2)} | Z: ${state.rawAccel.z.toFixed(2)}`;
        }

        function enableSimulation() {
            initAudio();
            updateStatus(false, true, "Simulation aktiv (Mus)");
            
            window.addEventListener('mousemove', (e) => {
                if(!state.isSimulating) return;
                
                const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                const mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
                
                state.rawAccel.x = mouseX;
                state.rawAccel.y = mouseY;
                
                const speed = Math.abs(e.movementX) + Math.abs(e.movementY);
                if (speed > 50) {
                    state.rawAccel.z = speed / 100;
                } else {
                    state.rawAccel.z *= 0.9;
                }
            });
        }

        function updateStatus(connected, simulating, text) {
            state.isConnected = connected;
            state.isSimulating = simulating;
            
            statusText.innerText = text;
            statusDot.className = 'dot';
            if (connected) statusDot.classList.add('connected');
            if (simulating) statusDot.classList.add('simulating');
            
            btnConnect.style.display = (connected || simulating) ? 'none' : 'block';
            btnSimulate.style.display = (connected || simulating) ? 'none' : 'block';
        }

        btnConnect.addEventListener('click', connectBluetooth);
        btnSimulate.addEventListener('click', enableSimulation);

        const clock = new THREE.Clock();

        function updateAudio() {
            if (!state.audioInitialized) return;

            const baseFreq = 200;
            const targetFreq = baseFreq + Math.max(0, (state.smoothAccel.x + 1) / 2) * 2800;
            audioNodes.filter.frequency.rampTo(targetFreq, 0.1);

            let yVal = Math.max(-1, Math.min(1, state.smoothAccel.y));
            let index = Math.floor(((yVal + 1) / 2) * (scale.length - 1));
            
            if (index !== state.currentNoteIndex) {
                state.currentNoteIndex = index;
                audioNodes.drone.frequency.rampTo(scale[index], 0.5);
            }

            let deltaZ = Math.abs(state.smoothAccel.z - state.lastZ);
            if (deltaZ > 0.15) {
                let randomNote = scale[Math.floor(Math.random() * scale.length)];
                let octaveUp = randomNote.substring(0, randomNote.length-1) + (parseInt(randomNote.slice(-1)) + 1);
                audioNodes.chimes.triggerAttackRelease(octaveUp, "8n", Tone.now(), Math.min(1, deltaZ * 2));
            }
            state.lastZ = state.smoothAccel.z;
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            const lerpFactor = 0.08;
            state.smoothAccel.x += (state.rawAccel.x - state.smoothAccel.x) * lerpFactor;
            state.smoothAccel.y += (state.rawAccel.y - state.smoothAccel.y) * lerpFactor;
            state.smoothAccel.z += (state.rawAccel.z - state.smoothAccel.z) * lerpFactor;

            const magnitude = Math.sqrt(
                Math.pow(state.smoothAccel.x, 2) + 
                Math.pow(state.smoothAccel.y, 2) + 
                Math.pow(state.smoothAccel.z, 2)
            );
            
            mesh.rotation.z = -state.smoothAccel.x * Math.PI;
            mesh.rotation.x = state.smoothAccel.y * Math.PI;
            mesh.rotation.y += 0.002;
            wireMesh.rotation.copy(mesh.rotation);

            const hue = (state.smoothAccel.x + 1.0) / 2.0; 
            colorLight1.color.setHSL(hue, 0.8, 0.5);
            colorLight2.color.setHSL((hue + 0.5) % 1.0, 0.8, 0.5); 

            const positions = geometry.attributes.position;
            const original = geometry.attributes.originalPosition;
            
            let deformationBase = 0.2;
            let deformationBoost = magnitude * 0.5; 
            let totalDeformation = deformationBase + deformationBoost;
            let speed = time * 1.5;

            for (let i = 0; i < positions.count; i++) {
                let vx = original.getX(i);
                let vy = original.getY(i);
                let vz = original.getZ(i);

                let freq = 1.2;
                let offset = Math.sin(vx * freq + speed) * 
                             Math.cos(vy * freq + speed) * 
                             Math.sin(vz * freq + speed);
                
                let scale = 1 + (offset * totalDeformation);
                positions.setXYZ(i, vx * scale, vy * scale, vz * scale);
            }
            
            positions.needsUpdate = true;
            geometry.computeVertexNormals(); 

            updateAudio();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
