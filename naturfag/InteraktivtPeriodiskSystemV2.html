<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komplet Periodesystem</title>
    <style>
        :root {
            --bg-color: #0d1117; --text-color: #c9d1d9; --panel-bg: #161b22;
            --nonmetal: #4caf50; --noble-gas: #2196f3; --alkali-metal: #f44336;
            --alkaline-earth: #ff9800; --metalloid: #9c27b0; --halogen: #ffeb3b;
            --post-transition: #00bcd4; --transition-metal: #e91e63;
            --lanthanide: #795548; --actinide: #607d8b; --unknown: #555555;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .controls { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 15px; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
        .main-container { display: flex; gap: 20px; width: 100%; flex-wrap: wrap; }
        .periodic-table { display: grid; grid-template-columns: repeat(18, 1fr); gap: 4px; flex: 3; min-width: 600px; }
        .element { aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 4px; cursor: pointer; position: relative; color: #fff; transition: transform 0.2s; font-size: min(1vw, 12px); box-sizing: border-box; }
        .element.dimmed { opacity: 0.2; filter: grayscale(80%); }
        .element:hover, .element.selected { transform: scale(1.15); z-index: 10; border: 1px solid #fff; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
        .element .num { position: absolute; top: 2px; left: 4px; font-size: 0.7em; }
        .element .state-icon { position: absolute; top: 2px; right: 4px; font-size: 0.8em; }
        .element .sym { font-weight: bold; font-size: 1.4em; }
        
        .nonmetal { background: var(--nonmetal); } .noble-gas { background: var(--noble-gas); } .alkali-metal { background: var(--alkali-metal); } .alkaline-earth { background: var(--alkaline-earth); } .metalloid { background: var(--metalloid); } .halogen { background: var(--halogen); color: #000; } .post-transition { background: var(--post-transition); } .transition-metal { background: var(--transition-metal); } .lanthanide { background: var(--lanthanide); } .actinide { background: var(--actinide); } .unknown { background: var(--unknown); }

        .panel { flex: 1; background: var(--panel-bg); border-radius: 8px; padding: 20px; min-width: 300px; }
        .tabs { display: flex; border-bottom: 1px solid #333; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; background: #222; border: none; color: #aaa; }
        .tab.active { background: #333; color: #fff; font-weight: bold; }
        .tab-content { display: none; flex-direction: column; align-items: center; }
        .tab-content.active { display: flex; }

        .bohr-wrap { position: relative; width: 260px; height: 260px; display: flex; justify-content: center; align-items: center; margin-top: 10px;}
        .nucleus { width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #000; z-index: 100; font-size: 0.7rem; font-weight: bold; }
        .shell { position: absolute; border: 1px dashed #555; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: spin linear infinite; }
        .shell.valence { border: 1px solid #00e5ff; }
        .electron { position: absolute; width: 8px; height: 8px; background: #aaa; border-radius: 50%; top: -4px; left: 50%; transform: translateX(-50%); }
        .valence .electron { background: #00e5ff; box-shadow: 0 0 5px #00e5ff; }
        @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; justify-content: center; }
        .legend-item { padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .legend-item:hover { opacity: 0.8; }
    </style>
</head>

            document.getElementById('temp-display').textContent = `${currentTemp} K`;
            document.getElementById('d-curtemp').textContent = currentTemp;
            updateStates();
        });

        function updateStates() {
            elements.forEach(el => {
                const icon = document.getElementById(`el-${el.z}`).querySelector('.state-icon');
                if (el.melt === 9999) { icon.textContent = '🧊'; return; } // Håndterer kunstige grundstoffer
                icon.textContent = currentTemp < el.melt ? '🧊' : (currentTemp < el.boil ? '💧' : '☁️');
            });
            if(selectedZ) selectEl(selectedZ, true);
        }

        function switchTab(t) {
            document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active'); document.getElementById(`tab-${t}`).classList.add('active');
        }

        function selectEl(z) {
            document.querySelectorAll('.element').forEach(el => el.classList.remove('selected'));
            document.getElementById(`el-${z}`).classList.add('selected'); selectedZ = z;
            const el = elements.find(e => e.z === z);
            
            // Opdater Tekst-data
            document.getElementById('d-title').textContent = el.name; document.getElementById('d-num').textContent = el.z;
            document.getElementById('d-mass').textContent = el.mass; document.getElementById('d-cat').textContent = cats[el.cat];
            document.getElementById('d-elec').textContent = `[${el.e.join(', ')}]`;
            
            // Håndter de syntetiske grundstoffer hvor vi ikke kender smelte/kogepunkt
            document.getElementById('d-melt').textContent = el.melt === 9999 ? 'Ukendt' : el.melt;
            document.getElementById('d-boil').textContent = el.boil === 9999 ? 'Ukendt' : el.boil;

                document.getElementById('d-state').textContent = currentTemp < el.melt ? "Fast (🧊)" : (currentTemp < el.boil ? "Væske (💧)" : "Gas (☁️)");

            document.getElementById('b-title').textContent = `${el.name} (${el.sym})`;
            const bArea = document.getElementById('bohr-area');
            bArea.innerHTML = `<div class="nucleus"><span>${el.z}p⁺</span><span>${el.neut}n⁰</span></div>`;
            
            el.e.forEach((numE, i) => {
                const isVal = i === el.e.length - 1;
                const s = document.createElement('div'); s.className = `shell ${isVal ? 'valence' : ''}`;
                
                // Gør skallerne tættere jo flere der er, så de kan være i billedet
                let shellGap = el.e.length > 5 ? 25 : 40; 
                let diam = 50 + (i * shellGap * 2); 
                
                s.style.width = `${diam}px`; s.style.height = `${diam}px`; s.style.animationDuration = `${4 + i*2}s`;
                for(let j=0; j<numE; j++) {
                    const w = document.createElement('div'); w.style.cssText = `position:absolute;top:50%;left:50%;width:100%;height:100%;transform:translate(-50%,-50%) rotate(${(360/numE)*j}deg)`;
                    w.innerHTML = `<div class="electron"></div>`; s.appendChild(w);
                }
                bArea.appendChild(s);
            });
        }
        
        document.addEventListener('keydown', e => {
            let n = selectedZ;
            if (e.key === 'ArrowRight') n = Math.min(118, selectedZ + 1);
            if (e.key === 'ArrowLeft') n = Math.max(1, selectedZ - 1);
            if (e.key === 'ArrowDown') n = Math.min(118, selectedZ + 18);
            if (e.key === 'ArrowUp') n = Math.max(1, selectedZ - 18);
            if (n !== selectedZ && elements.find(el => el.z === n)) { selectEl(n); e.preventDefault(); }
        });

        // Start 
        updateStates(); selectEl(1);
    </script>
</body>
</html>
