<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>Juniorbiolog Quiz 🌱</title>
  <style>
    :root {
      --bg-dark: #022b3a;
      --bg-main: #034f4a;
      --bg-card: #0b6e4f;
      --accent: #2ca58d;
      --accent-light: #8ff0c6;
      --text-main: #e9f7f5;
      --text-muted: #c4e3dd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0466c8 0, #022b3a 40%, #01161e 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Svævende mikroskop-celler i baggrunden */
    .floating-emoji {
      position: fixed;
      font-size: 2.2rem;
      opacity: 0.18;
      animation: floatUp 18s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    .floating-emoji:nth-child(1) { left: 10%; animation-duration: 22s; font-size: 2.6rem; }
    .floating-emoji:nth-child(2) { left: 30%; animation-duration: 18s; }
    .floating-emoji:nth-child(3) { left: 50%; animation-duration: 26s; font-size: 2.8rem; }
    .floating-emoji:nth-child(4) { left: 70%; animation-duration: 20s; }
    .floating-emoji:nth-child(5) { left: 85%; animation-duration: 24s; font-size: 2.4rem; }

    @keyframes floatUp {
      0% { transform: translateY(110vh); }
      100% { transform: translateY(-20vh); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 95%;
      max-width: 900px;
      background: linear-gradient(145deg, rgba(3, 79, 74, 0.96), rgba(1, 45, 50, 0.98));
      border-radius: 18px;
      padding: 24px 24px 28px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(143, 240, 198, 0.25);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .title-block h1 {
      font-size: 1.7rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .title-block p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .badge {
      background: rgba(8, 127, 91, 0.9);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid rgba(143, 240, 198, 0.4);
    }

    .difficulty-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .difficulty-btn {
      flex: 1 1 100px;
      border-radius: 999px;
      border: 1px solid rgba(143, 240, 198, 0.4);
      background: rgba(1, 45, 50, 0.7);
      color: var(--text-main);
      padding: 6px 10px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      transition: background 0.2s, transform 0.1s, border-color 0.2s;
    }

    .difficulty-btn.active {
      background: var(--accent);
      border-color: var(--accent-light);
      color: #022b3a;
      font-weight: 600;
    }

    .difficulty-btn:hover {
      transform: translateY(-1px);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .plant-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
    }

    .plant-stage {
      font-size: 1.6rem;
    }

    .progress-bar-wrapper {
      flex: 1;
      background: rgba(1, 45, 50, 0.9);
      border-radius: 999px;
      overflow: hidden;
      height: 10px;
      border: 1px solid rgba(143, 240, 198, 0.4);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8ff0c6, #2ca58d);
      transition: width 0.25s ease-out;
    }

    .score-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      min-width: 90px;
      text-align: right;
    }

    .card {
      background: rgba(1, 45, 50, 0.9);
      border-radius: 14px;
      padding: 16px 16px 14px;
      border: 1px solid rgba(143, 240, 198, 0.35);
      margin-bottom: 12px;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .question-header span {
      font-size: 0.9rem;
      color: var(--accent-light);
    }

    .question-text {
      font-size: 1.05rem;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .answers {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
    }

    .answer-btn {
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(143, 240, 198, 0.35);
      background: rgba(3, 79, 74, 0.7);
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s, transform 0.08s, border-color 0.15s;
    }

    .answer-btn:hover {
      background: rgba(8, 127, 91, 0.9);
      transform: translateY(-1px);
    }

    .answer-btn.correct {
      background: #2ca58d;
      border-color: #8ff0c6;
      color: #022b3a;
      font-weight: 600;
    }

    .answer-btn.wrong {
      background: #8b1e3f;
      border-color: #ffb3c1;
    }

    .feedback {
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    .feedback.correct {
      color: #8ff0c6;
    }

    .feedback.wrong {
      color: #ffb3c1;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border-radius: 999px;
      border: none;
      padding: 7px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--accent);
      color: #022b3a;
      font-weight: 600;
      transition: background 0.15s, transform 0.08s, box-shadow 0.15s;
    }

    .btn.secondary {
      background: rgba(1, 45, 50, 0.9);
      color: var(--text-main);
      border: 1px solid rgba(143, 240, 198, 0.4);
      font-weight: 500;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .summary {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .hidden {
      display: none;
    }

    /* Afslutningsskærm */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .overlay-content {
      background: linear-gradient(145deg, #034f4a, #022b3a);
      border-radius: 18px;
      padding: 22px 22px 18px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      border: 1px solid rgba(143, 240, 198, 0.6);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .leaf {
      position: absolute;
      font-size: 1.8rem;
      animation: leafFall 4s linear infinite;
      opacity: 0.9;
    }

    .leaf:nth-child(1) { left: 10%; animation-delay: 0s; }
    .leaf:nth-child(2) { left: 30%; animation-delay: 0.6s; }
    .leaf:nth-child(3) { left: 55%; animation-delay: 1.2s; }
    .leaf:nth-child(4) { left: 75%; animation-delay: 1.8s; }

    @keyframes leafFall {
      0% { transform: translateY(-40px) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(260px) rotate(40deg); opacity: 0; }
    }

    .badge-sign {
      margin: 10px auto 8px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(1, 45, 50, 0.95);
      border: 1px solid rgba(143, 240, 198, 0.7);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .overlay h2 {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .overlay p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    @media (max-width: 640px) {
      .title-block h1 {
        font-size: 1.4rem;
      }
      .question-text {
        font-size: 1rem;
      }
      .answer-btn {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <!-- Svævende mikroskop-celler 🔬+🦠 -->
  <div class="floating-emoji">🔬🦠</div>
  <div class="floating-emoji">🦠🔬</div>
  <div class="floating-emoji">🔬🦠</div>
  <div class="floating-emoji">🦠🔬</div>
  <div class="floating-emoji">🔬🦠</div>

  <div class="container">
    <header>
      <div class="title-block">
        <h1>Juniorbiolog Quiz 🌱🔬</h1>
        <p>Test din viden om celler 🦠, fotosyntese 🌱 og dyreriget 🐾.</p>
      </div>
      <div class="badge">
        Naturfag • Mellemtrinnet 🧪🧬
      </div>
    </header>

    <div class="difficulty-tabs">
      <button class="difficulty-btn active" data-level="easy">Let 🌱 (ca. 4.–5. kl.)</button>
      <button class="difficulty-btn" data-level="medium">Mellem 🌿 (ca. 5.–6. kl.)</button>
      <button class="difficulty-btn" data-level="hard">Svær 🌳 (ca. 6.–7. kl.)</button>
    </div>

    <div class="status-row">
      <div class="plant-progress">
        <span>Fremskridt:</span>
        <span id="plantStage" class="plant-stage">🌱</span>
      </div>
      <div class="progress-bar-wrapper">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div class="score-label">
        Point: <span id="scoreDisplay">0</span>/<span id="totalDisplay">0</span>
      </div>
    </div>

    <div class="card">
      <div class="question-header">
        <span id="questionCounter">Spørgsmål 1</span>
        <span id="topicTag">🦠 Celler</span>
      </div>
      <div id="questionText" class="question-text">
        <!-- Spørgsmål indsættes med JS -->
      </div>
      <div id="answers" class="answers">
        <!-- Svarmuligheder indsættes med JS -->
      </div>
      <div id="feedback" class="feedback"></div>
      <div class="controls">
        <button id="nextBtn" class="btn" disabled>Næste spørgsmål ➜</button>
        <button id="restartBtn" class="btn secondary">Start forfra 🔁</button>
      </div>
      <div id="summary" class="summary"></div>
    </div>
  </div>

  <!-- Afslutningsskærm -->
  <div id="overlay" class="overlay">
    <div class="overlay-content">
      <div class="leaf">🍃</div>
      <div class="leaf">🍃</div>
      <div class="leaf">🍃</div>
      <div class="leaf">🍃</div>

      <h2>Flot klaret! 🌿</h2>
      <p>Du har gennemført quizzen og vist stærk naturfagsviden.</p>

      <div class="badge-sign">
        <span>Juniorbiolog</span>
        <span>🔬🧪🧬</span>
      </div>

      <p id="finalScoreText"></p>

      <button id="closeOverlayBtn" class="btn">Prøv igen eller skift niveau 🌱</button>
    </div>
  </div>

  <script>
    // Spørgsmål opdelt i tre sværhedsgrader
    const quizData = {
      easy: [
        {
          topic: "🦠 Celler",
          question: "Hvad er en celle?",
          answers: [
            "En lille byggeklods, som levende organismer er opbygget af",
            "En type sten, man finder i jorden",
            "En maskine, der laver strøm"
          ],
          correctIndex: 0
        },
        {
          topic: "🌱 Fotosyntese",
          question: "Hvad skal en grøn plante bruge for at lave fotosyntese?",
          answers: [
            "Vand, lys og kuldioxid",
            "Mælk, sukker og olie",
            "Kun jord"
          ],
          correctIndex: 0
        },
        {
          topic: "🐾 Dyreriget",
          question: "Hvilket dyr er et pattedyr?",
          answers: [
            "Frø",
            "Løve",
            "Laks"
          ],
          correctIndex: 1
        }
      ],
      medium: [
        {
          topic: "🦠 Celler",
          question: "Hvad kaldes den del af cellen, hvor arvematerialet (DNA 🧬) ligger?",
          answers: [
            "Cellevæggen",
            "Cellekernen",
            "Cellemembranen"
          ],
          correctIndex: 1
        },
        {
          topic: "🌱 Fotosyntese",
          question: "Hvilken gas optager planten fra luften under fotosyntese?",
          answers: [
            "Ilt (O₂)",
            "Kuldioxid (CO₂)",
            "Nitrogen (N₂)"
          ],
          correctIndex: 1
        },
        {
          topic: "🐾 Dyreriget",
          question: "Hvilken gruppe dyr har typisk våde, glatte skind og lægger æg i vand?",
          answers: [
            "Fugle",
            "Padder",
            "Pattedyr"
          ],
          correctIndex: 1
        }
      ],
      hard: [
        {
          topic: "🧬 Cellestruktur",
          question: "Hvad er forskellen på en plantecelle 🌱 og en dyrecelle 🐾?",
          answers: [
            "Planteceller har cellevæg og grønkorn, det har dyreceller ikke",
            "Dyreceller har cellevæg, det har planteceller ikke",
            "Der er ingen forskel"
          ],
          correctIndex: 0
        },
        {
          topic: "🌱 Fotosyntese",
          question: "Hvad er det vigtigste produkt, planten danner ved fotosyntese?",
          answers: [
            "Salt",
            "Sukker (glukose)",
            "Jern"
          ],
          correctIndex: 1
        },
        {
          topic: "🐾 Klassificering",
          question: "Hvilken gruppe hører en ørred (fisk) til i dyreriget?",
          answers: [
            "Pattedyr",
            "Fugle",
            "Hvirveldyr"
          ],
          correctIndex: 2
        }
      ]
    };

    let currentLevel = "easy";
    let currentIndex = 0;
    let score = 0;
    let answered = false;

    const questionTextEl = document.getElementById("questionText");
    const answersEl = document.getElementById("answers");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const restartBtn = document.getElementById("restartBtn");
    const questionCounterEl = document.getElementById("questionCounter");
    const topicTagEl = document.getElementById("topicTag");
    const scoreDisplayEl = document.getElementById("scoreDisplay");
    const totalDisplayEl = document.getElementById("totalDisplay");
    const progressBarEl = document.getElementById("progressBar");
    const plantStageEl = document.getElementById("plantStage");
    const summaryEl = document.getElementById("summary");
    const overlayEl = document.getElementById("overlay");
    const finalScoreTextEl = document.getElementById("finalScoreText");
    const closeOverlayBtn = document.getElementById("closeOverlayBtn");
    const difficultyButtons = document.querySelectorAll(".difficulty-btn");

    function getCurrentQuestions() {
      return quizData[currentLevel];
    }

    function updateTotals() {
      const total = getCurrentQuestions().length;
      totalDisplayEl.textContent = total;
    }

    function updateProgress() {
      const total = getCurrentQuestions().length;
      const progressPercent = (currentIndex / total) * 100;
      progressBarEl.style.width = progressPercent + "%";

      const ratio = score / total;
      if (ratio === 0) {
        plantStageEl.textContent = "🌱";
      } else if (ratio < 0.67) {
        plantStageEl.textContent = "🌿";
      } else {
        plantStageEl.textContent = "🌳";
      }
    }

    function renderQuestion() {
      const questions = getCurrentQuestions();
      const q = questions[currentIndex];

      questionTextEl.textContent = q.question;
      topicTagEl.textContent = q.topic;
      questionCounterEl.textContent = `Spørgsmål ${currentIndex + 1} af ${questions.length}`;
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      summaryEl.textContent = "";
      nextBtn.disabled = true;
      answered = false;

      answersEl.innerHTML = "";
      q.answers.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.className = "answer-btn";
        btn.innerHTML = `<span>🧫</span><span>${answer}</span>`;
        btn.addEventListener("click", () => handleAnswer(index, btn));
        answersEl.appendChild(btn);
      });

      updateTotals();
      updateProgress();
      scoreDisplayEl.textContent = score;
    }

    function handleAnswer(selectedIndex, buttonEl) {
      if (answered) return;
      answered = true;

      const questions = getCurrentQuestions();
      const q = questions[currentIndex];

      const buttons = answersEl.querySelectorAll(".answer-btn");
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.correctIndex) {
          btn.classList.add("correct");
        }
      });

      if (selectedIndex === q.correctIndex) {
        score++;
        feedbackEl.textContent = "Korrekt! 🌱 Godt tænkt, juniorbiolog.";
        feedbackEl.classList.add("correct");
      } else {
        buttonEl.classList.add("wrong");
        feedbackEl.textContent = "Ikke helt. Prøv at lægge mærke til nøgleordene i spørgsmålet næste gang. 🧬";
        feedbackEl.classList.add("wrong");
      }

      scoreDisplayEl.textContent = score;
      updateProgress();

      nextBtn.disabled = false;

      const total = questions.length;
      summaryEl.textContent = `Du har nu ${score} ud af ${total} mulige point på dette niveau.`;
    }

    function nextQuestion() {
      const questions = getCurrentQuestions();
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        showOverlay();
      }
    }

    function resetQuiz(level = currentLevel) {
      currentLevel = level;
      currentIndex = 0;
      score = 0;
      scoreDisplayEl.textContent = score;
      updateTotals();
      updateProgress();
      renderQuestion();
    }

    function showOverlay() {
      const total = getCurrentQuestions().length;
      const percent = Math.round((score / total) * 100);
      finalScoreTextEl.textContent = `Du fik ${score} ud af ${total} rigtige (${percent}%). 🌳`;
      overlayEl.style.display = "flex";
    }

    function hideOverlay() {
      overlayEl.style.display = "none";
    }

    // Event listeners
    nextBtn.addEventListener("click", nextQuestion);
    restartBtn.addEventListener("click", () => resetQuiz());
    closeOverlayBtn.addEventListener("click", () => {
      hideOverlay();
      resetQuiz();
    });

    difficultyButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        difficultyButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const level = btn.getAttribute("data-level");
        hideOverlay();
        resetQuiz(level);
      });
    });

    // Init
    resetQuiz("easy");
  </script>
</body>
</html>
